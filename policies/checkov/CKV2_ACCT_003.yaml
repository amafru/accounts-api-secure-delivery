# Prevents recurrence of the artefact (b) defect. Threats: T3/T4 (see docs/section4-review-remediate.md)
metadata:
  id: "CKV2_ACCT_003"
  name: "RDS must keep at least 7 days of backups"
  category: "GENERAL_SECURITY"
definition:
  cond_type: attribute
  resource_types:
    - aws_db_instance
  attribute: backup_retention_period
  operator: greater_than_or_equal
  value: 7
