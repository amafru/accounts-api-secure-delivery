# Secrets delivery for accounts-api via External Secrets Operator (ESO). Threats [T3] [T4].
# No secret value is in this repo. ESO reads AWS Secrets Manager using IRSA (IAM Roles for Service Accounts).
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: accounts
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: eso-reader          # annotated with eks.amazonaws.com/role-arn, read-only to the rds!db-* secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: accounts-api-db
  namespace: accounts
spec:
  refreshInterval: 15m                # normal drift: a rotated secret reaches the cluster within 15 minutes
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: accounts-api-db
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef: { key: rds!db-EXAMPLE, property: username }
    - secretKey: password
      remoteRef: { key: rds!db-EXAMPLE, property: password }
# Mounted as a FILE at /var/run/secrets/db/ (not env vars): files do not leak via `env`, crash dumps or child processes,
# and the Falco rule watches exactly that path.
